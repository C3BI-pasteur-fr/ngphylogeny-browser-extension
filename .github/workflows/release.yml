name: Sign and release

# Triggered by pushing a version tag, e.g.:
#   git tag v0.2.0 && git push origin v0.2.0
# The tag's version (without the leading "v") must match manifest.json's "version".

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Run the parser test suite
        run: npm test

      - name: Check that manifest.json's version matches the tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION="$(jq -r .version manifest.json)"
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "Tag is v$TAG_VERSION but manifest.json says $MANIFEST_VERSION" >&2
            exit 1
          fi

      - name: Lint the extension
        run: npx web-ext lint

      - name: Build the extension
        run: npx web-ext build --overwrite-dest

      - name: Sign the extension for self-distribution (unlisted)
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: npx web-ext sign --channel=unlisted --artifacts-dir web-ext-artifacts

      - name: Prepare release assets
        id: assets
        run: |
          XPI="$(ls web-ext-artifacts/*.xpi)"
          echo "xpi=$XPI" >> "$GITHUB_OUTPUT"
          ADDON_ID="$(jq -r .browser_specific_settings.gecko.id manifest.json)"
          VERSION="$(jq -r .version manifest.json)"
          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/$(basename "$XPI")"
          jq -n \
            --arg id "$ADDON_ID" --arg version "$VERSION" --arg url "$DOWNLOAD_URL" \
            '{addons: {($id): {updates: [{version: $version, update_link: $url}]}}}' \
            > web-ext-artifacts/updates.json

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.assets.outputs.xpi }}" \
            web-ext-artifacts/updates.json \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
